name: Deploy Web App to Azure Storage

on:
  push:
    paths:
      - 'device-loan-web/**'
      - '.github/workflows/deploy-web.yml'

env:
  AZURE_STORAGE_ACCOUNT_NAME: 'webf5038411'
  SOURCE_DIR: 'device-loan-web'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '18.x'

    - name: Build
      run: |
        cd ${{ env.SOURCE_DIR }}
        npm install
        npm run build
      env:
        VITE_INVENTORY_API: ${{ secrets.VITE_INVENTORY_API }}
        VITE_BOOKING_API: ${{ secrets.VITE_BOOKING_API }}

    - name: Log in with Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Upload to Azure Storage
      uses: azure/CLI@v1
      with:
        inlineScript: |
            az storage blob upload-batch --account-name ${{ env.AZURE_STORAGE_ACCOUNT_NAME }} --auth-mode key -d '$web' -s ${{ env.SOURCE_DIR }}/dist --overwrite
